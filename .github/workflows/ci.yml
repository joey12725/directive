name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Relay (types + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cyrus
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cyrus/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cyrus/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter cyrus-relay...
      - run: pnpm --filter cyrus-relay check:types
      - run: pnpm --filter cyrus-relay test

  api:
    name: Orchestration API tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plane"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: cyrus/apps/api
    env:
      DATABASE_URL: postgresql://plane:plane@localhost:5432/plane
      REDIS_URL: redis://localhost:6379/
      # Background tasks are queued to an in-memory broker; nothing consumes them in tests.
      AMQP_URL: memory://
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cyrus/apps/api/requirements/*.txt
      - name: Install dependencies
        run: |
          grep -v '^psycopg-c==' requirements/base.txt > /tmp/base.txt
          grep -v '^-r ' requirements/test.txt > /tmp/test.txt
          pip install -r /tmp/base.txt -r /tmp/test.txt
      - name: Run orchestration tests
        run: >-
          pytest
          plane/tests/unit/test_lifecycle.py
          plane/tests/unit/test_cyrus_phase2.py
          plane/tests/unit/test_cyrus_phase3.py
          plane/tests/unit/test_dashboard_metrics.py
          plane/tests/contract/api/test_cyrus_phase1.py
